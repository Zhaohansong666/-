<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网安24-1 · 班级管理系统</title>
  <style>
    /* ── 全局基础 ── */
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f1f5f9;
      --sidebar-bg: #0f172a;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-secondary: #64748b;
      --border-color: #e2e8f0;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.05);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    body { background: var(--bg-color); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

    /* ── 侧边栏 ── */
    .sidebar { width: 260px; background: var(--sidebar-bg); color: #fff; display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar-header { padding: 24px; font-size: 18px; font-weight: 600; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; gap: 10px; }
    .sidebar-header span { background: var(--primary); padding: 2px 8px; border-radius: 6px; font-size: 12px; }
    .nav-menu { padding: 16px 12px; flex: 1; }
    .nav-item { padding: 12px 16px; margin-bottom: 4px; border-radius: 8px; cursor: pointer; color: #94a3b8; display: flex; align-items: center; gap: 12px; transition: 0.2s; }
    .nav-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
    .nav-item.active { background: var(--primary); color: #fff; font-weight: 500; }

    /* ── 主内容区 ── */
    .main-content { flex: 1; overflow-y: auto; padding: 32px; }
    .page { display: none; animation: fadeIn 0.3s ease; }
    .page.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .page-title { font-size: 24px; font-weight: 600; margin-bottom: 24px; color: var(--text-main); }

    /* ── 通用卡片与按钮 ── */
    .card { background: var(--card-bg); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); border: 1px solid var(--border-color); }
    .btn { padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-danger:hover { background: #dc2626; }
    .btn-outline { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); }
    .btn-outline:hover { background: #f8fafc; }
    .input-control { padding: 10px 14px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; outline: none; transition: 0.2s; width: 100%; }
    .input-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }

    /* ── 页面1：班级概况 ── */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
    .stat-card { padding: 24px; border-radius: var(--radius); background: linear-gradient(135deg, #fff 0%, #f8fafc 100%); border: 1px solid var(--border-color); box-shadow: var(--shadow); position: relative; overflow: hidden; }
    .stat-card::after { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--primary); }
    .stat-label { color: var(--text-secondary); font-size: 14px; margin-bottom: 8px; }
    .stat-value { font-size: 28px; font-weight: 600; color: var(--text-main); }

    /* ── 页面2：学生名单 ── */
    .toolbar { display: flex; justify-content: space-between; margin-bottom: 20px; gap: 16px; }
    .search-box { position: relative; width: 320px; }
    .search-box input { padding-left: 36px; }
    .search-box::before { content: '🔍'; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 14px; }
    
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 14px; }
    th { background: #f8fafc; color: var(--text-secondary); font-weight: 600; }
    tr:hover { background: #f8fafc; }
    .action-btn { padding: 4px 8px; border-radius: 4px; border: none; background: #fee2e2; color: #ef4444; cursor: pointer; font-size: 12px; }
    .action-btn:hover { background: #fecaca; }

    /* ── 页面3：抽签工具 ── */
    .draw-container { display: flex; gap: 32px; align-items: flex-start; }
    .wheel-wrapper { position: relative; width: 400px; height: 400px; flex-shrink: 0; }
    .wheel { width: 100%; height: 100%; border-radius: 50%; border: 8px solid #fff; box-shadow: var(--shadow-lg); transition: transform 5s cubic-bezier(0.1, 0.7, 0.1, 1); position: relative; overflow: hidden; }
    .pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 30px; height: 40px; background: #ef4444; clip-path: polygon(50% 100%, 0 0, 100% 0); z-index: 10; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }
    .draw-controls { flex: 1; }
    .draw-list { list-style: none; margin-top: 16px; display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; }
    .draw-list li { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: #f8fafc; border-radius: 8px; border: 1px solid var(--border-color); }

    /* ── 页面4：班级日志 ── */
    .log-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .log-card { background: #fff; border-radius: var(--radius); padding: 20px; border: 1px solid var(--border-color); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; }
    .log-header { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-secondary); }
    .log-title { font-size: 18px; font-weight: 600; }
    .log-content { font-size: 14px; color: #475569; line-height: 1.6; flex: 1; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .log-footer { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--text-secondary); margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-color); }
    .log-photo { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; margin-top: 10px; background: #f1f5f9; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); font-size: 12px; overflow: hidden; }
    .log-photo img { width: 100%; height: 100%; object-fit: cover; }

    /* ── 弹窗 (Modal) ── */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
    .modal-overlay.active { display: flex; }
    .modal { background: #fff; width: 500px; border-radius: var(--radius); padding: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); animation: slideUp 0.3s ease; }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal h3 { margin-bottom: 20px; font-size: 18px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500; color: var(--text-secondary); }
    textarea.input-control { resize: vertical; min-height: 100px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }
  </style>
</head>
<body>

  <!-- 侧边栏导航 -->
  <div class="sidebar">
    <div class="sidebar-header">
      网安24-1 <span>管理系统</span>
    </div>
    <div class="nav-menu">
      <div class="nav-item active" onclick="switchPage('dashboard', this)">📊 班级概况</div>
      <div class="nav-item" onclick="switchPage('students', this)">👥 学生名单</div>
      <div class="nav-item" onclick="switchPage('draw', this)">🎯 抽签工具</div>
      <div class="nav-item" onclick="switchPage('logs', this)">📝 班级日志</div>
    </div>
  </div>

  <!-- 主内容区 -->
  <div class="main-content">
    
    <!-- 页面1：班级概况 -->
    <div id="dashboard" class="page active">
      <h2 class="page-title">班级概况</h2>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">总人数</div>
          <div class="stat-value" id="dash-total">45 人</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">今日出勤率</div>
          <div class="stat-value" style="color: #10b981;">98%</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">累计日志</div>
          <div class="stat-value" id="dash-logs">0 篇</div>
        </div>
      </div>
    </div>

    <!-- 页面2：学生名单 -->
    <div id="students" class="page">
      <h2 class="page-title">学生名单</h2>
      <div class="card">
        <div class="toolbar">
          <div class="search-box">
            <input type="text" class="input-control" placeholder="搜索姓名或学号..." oninput="renderStudents()">
          </div>
          <button class="btn btn-primary" onclick="openModal('studentModal')">+ 添加学生</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>姓名</th>
              <th>班级</th>
              <th>学号</th>
              <th>备注</th>
              <th style="width: 80px;">操作</th>
            </tr>
          </thead>
          <tbody id="studentTableBody"></tbody>
        </table>
      </div>
    </div>

    <!-- 页面3：抽签工具 -->
    <div id="draw" class="page">
      <h2 class="page-title">抽签工具</h2>
      <div class="card">
        <div class="draw-container">
          <div class="wheel-wrapper">
            <div class="pointer"></div>
            <div class="wheel" id="wheel"></div>
            <button class="btn btn-primary" style="position: absolute; bottom: -24px; left: 50%; transform: translateX(-50%); width: 120px; justify-content: center;" onclick="spinWheel()">开始抽签</button>
          </div>
          <div class="draw-controls">
            <h3 style="font-size: 16px; margin-bottom: 12px;">选项设置</h3>
            <div style="display: flex; gap: 8px;">
              <input type="text" class="input-control" id="newDrawItem" placeholder="输入新选项...">
              <button class="btn btn-primary" onclick="addDrawItem()">添加</button>
            </div>
            <ul class="draw-list" id="drawList"></ul>
          </div>
        </div>
      </div>
    </div>

    <!-- 页面4：班级日志 -->
    <div id="logs" class="page">
      <h2 class="page-title">班级日志</h2>
      <div style="margin-bottom: 24px;">
        <button class="btn btn-primary" onclick="openModal('logModal')">+ 添加日志</button>
      </div>
      <div class="log-grid" id="logGrid"></div>
    </div>
  </div>

  <!-- 弹窗：添加学生 -->
  <div class="modal-overlay" id="studentModal">
    <div class="modal">
      <h3>添加新学生</h3>
      <div class="form-group"><label>姓名</label><input type="text" class="input-control" id="s-name"></div>
      <div class="form-group"><label>班级</label><input type="text" class="input-control" id="s-class" value="网安24-1"></div>
      <div class="form-group"><label>学号</label><input type="text" class="input-control" id="s-id"></div>
      <div class="form-group"><label>备注</label><input type="text" class="input-control" id="s-remark"></div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeModal('studentModal')">取消</button>
        <button class="btn btn-primary" onclick="addStudent()">保存</button>
      </div>
    </div>
  </div>

  <!-- 弹窗：添加日志 -->
  <div class="modal-overlay" id="logModal">
    <div class="modal">
      <h3>记录新日志</h3>
      <div class="form-group"><label>日期</label><input type="date" class="input-control" id="l-date"></div>
      <div class="form-group"><label>主题</label><input type="text" class="input-control" id="l-title" placeholder="例如：班会总结、活动记录..."></div>
      <div class="form-group"><label>内容</label><textarea class="input-control" id="l-content" placeholder="记录具体内容..."></textarea></div>
      <div class="form-group"><label>照片</label><input type="file" class="input-control" id="l-photo" accept="image/*"></div>
      <div class="form-group"><label>上报人</label><input type="text" class="input-control" id="l-reporter" placeholder="你的姓名"></div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeModal('logModal')">取消</button>
        <button class="btn btn-primary" onclick="addLog()">发布日志</button>
      </div>
    </div>
  </div>

  <script>
    // ── 数据存储 (LocalStorage) ──
    let students = JSON.parse(localStorage.getItem('students')) || [
      { id: 1, name: '张三', className: '网安24-1', studentId: '2024001', remark: '班长' },
      { id: 2, name: '李四', className: '网安24-1', studentId: '2024002', remark: '' }
    ];
    
    let drawItems = JSON.parse(localStorage.getItem('drawItems')) || ['选项 A', '选项 B', '选项 C', '选项 D'];
    
    let logs = JSON.parse(localStorage.getItem('logs')) || [];

    // ── 页面切换 ──
    function switchPage(pageId, element) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
      document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
      element.classList.add('active');
      
      // 切换时刷新对应数据
      if(pageId === 'dashboard') updateDashboard();
      if(pageId === 'students') renderStudents();
      if(pageId === 'draw') renderDraw();
      if(pageId === 'logs') renderLogs();
    }

    function updateDashboard() {
      document.getElementById('dash-total').innerText = students.length + ' 人';
      document.getElementById('dash-logs').innerText = logs.length + ' 篇';
    }

    // ── 模态框控制 ──
    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    // ── 学生名单逻辑 ──
    function renderStudents() {
      const keyword = document.querySelector('.search-box input').value.toLowerCase();
      const tbody = document.getElementById('studentTableBody');
      tbody.innerHTML = '';
      
      students.filter(s => s.name.toLowerCase().includes(keyword) || s.studentId.includes(keyword))
        .forEach(s => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${s.name}</td>
            <td>${s.className}</td>
            <td>${s.studentId}</td>
            <td>${s.remark}</td>
            <td><button class="action-btn" onclick="deleteStudent(${s.id})">删除</button></td>
          `;
          tbody.appendChild(tr);
        });
    }

    function addStudent() {
      const name = document.getElementById('s-name').value;
      const className = document.getElementById('s-class').value;
      const studentId = document.getElementById('s-id').value;
      const remark = document.getElementById('s-remark').value;
      if(!name || !studentId) return alert('姓名和学号必填');
      
      students.push({ id: Date.now(), name, className, studentId, remark });
      localStorage.setItem('students', JSON.stringify(students));
      closeModal('studentModal');
      renderStudents();
      // 清空表单
      document.getElementById('s-name').value = '';
      document.getElementById('s-id').value = '';
      document.getElementById('s-remark').value = '';
    }

    function deleteStudent(id) {
      if(confirm('确认删除该学生？')) {
        students = students.filter(s => s.id !== id);
        localStorage.setItem('students', JSON.stringify(students));
        renderStudents();
      }
    }

    // ── 抽签工具逻辑 ──
    let currentRotation = 0;
    let isSpinning = false;

    function renderDraw() {
      const list = document.getElementById('drawList');
      list.innerHTML = '';
      drawItems.forEach((item, index) => {
        const li = document.createElement('li');
        li.innerHTML = `
          <span>${item}</span>
          <button class="action-btn" onclick="removeDrawItem(${index})">删除</button>
        `;
        list.appendChild(li);
      });
      drawWheel();
    }

    function addDrawItem() {
      const input = document.getElementById('newDrawItem');
      const val = input.value.trim();
      if(val) {
        drawItems.push(val);
        localStorage.setItem('drawItems', JSON.stringify(drawItems));
        input.value = '';
        renderDraw();
      }
    }

    function removeDrawItem(index) {
      if(drawItems.length <= 1) return alert('至少保留一个选项');
      drawItems.splice(index, 1);
      localStorage.setItem('drawItems', JSON.stringify(drawItems));
      renderDraw();
    }

    function drawWheel() {
      const wheel = document.getElementById('wheel');
      const num = drawItems.length;
      const colors = ['#2563eb', '#3b82f6', '#60a5fa', '#93c5fd', '#1d4ed8', '#1e40af'];
      let gradient = `conic-gradient(`;
      for(let i=0; i<num; i++) {
        gradient += `${colors[i % colors.length]} ${i * (360/num)}deg ${(i+1) * (360/num)}deg,`;
      }
      wheel.style.background = gradient.slice(0, -1) + ')';
    }

    function spinWheel() {
      if(isSpinning) return;
      isSpinning = true;
      const randomDeg = Math.floor(Math.random() * 360) + 1800; // 至少转5圈 (1800deg)
      currentRotation += randomDeg;
      document.getElementById('wheel').style.transform = `rotate(${currentRotation}deg)`;
      
      setTimeout(() => {
        isSpinning = false;
        const finalDeg = currentRotation % 360;
        const index = Math.floor((360 - finalDeg) / (360 / drawItems.length)) % drawItems.length;
        alert(`🎉 抽签结果：${drawItems[index]}`);
      }, 5000); // 5秒动画时间
    }

    // ── 班级日志逻辑 ──
    function renderLogs() {
      const grid = document.getElementById('logGrid');
      grid.innerHTML = '';
      // 按时间倒序
      const sortedLogs = [...logs].sort((a, b) => new Date(b.date) - new Date(a.date));
      
      sortedLogs.forEach(log => {
        const div = document.createElement('div');
        div.className = 'log-card';
        div.innerHTML = `
          <div class="log-header">
            <span>${log.date}</span>
            <button class="action-btn" onclick="deleteLog(${log.id})" style="background:transparent; padding:0; font-size:16px;">&times;</button>
          </div>
          <div class="log-title">${log.title}</div>
          <div class="log-content">${log.content}</div>
          ${log.photo ? `<div class="log-photo"><img src="${log.photo}"></div>` : ''}
          <div class="log-footer">
            <span>上报人：${log.reporter}</span>
          </div>
        `;
        grid.appendChild(div);
      });
    }

    function addLog() {
      const date = document.getElementById('l-date').value;
      const title = document.getElementById('l-title').value;
      const content = document.getElementById('l-content').value;
      const reporter = document.getElementById('l-reporter').value;
      const photoFile = document.getElementById('l-photo').files[0];

      if(!date || !title || !content) return alert('日期、主题和内容必填');

      const processLog = (photoBase64 = null) => {
        logs.push({ id: Date.now(), date, title, content, reporter, photo: photoBase64 });
        localStorage.setItem('logs', JSON.stringify(logs));
        closeModal('logModal');
        renderLogs();
        // 清空
        document.getElementById('l-title').value = '';
        document.getElementById('l-content').value = '';
        document.getElementById('l-photo').value = '';
      };

      if(photoFile) {
        const reader = new FileReader();
        reader.onload = (e) => processLog(e.target.result);
        reader.readAsDataURL(photoFile);
      } else {
        processLog();
      }
    }

    function deleteLog(id) {
      if(confirm('删除此日志？')) {
        logs = logs.filter(l => l.id !== id);
        localStorage.setItem('logs', JSON.stringify(logs));
        renderLogs();
      }
    }

    // 初始化
    document.getElementById('l-date').valueAsDate = new Date();
    updateDashboard();
  </script>
</body>
</html>
